name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2.4-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  static-build:
    name: Static Linux build
    runs-on: ubuntu-latest
    container: swift:6.2.4-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install static Linux SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.2.4-release/static-sdk/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz \
            --checksum adf14ce1f6338f66b55f7a6ef39a448fd0fb353d5262be4666e98140f4c9b4fd
      - name: Build static binary
        run: swift build -c release --swift-sdk x86_64-swift-linux-musl
