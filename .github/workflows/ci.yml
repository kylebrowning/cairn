name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2.4-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  static-build:
    name: Static Linux build
    runs-on: ubuntu-latest
    container: swift:6.2.4-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install static Linux SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.2.4-release/static-sdk/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz \
            --checksum 24bdf84495dd31a6de2eb679647c1982b747bfbfe1a2060c779d84dcecd902a4
      - name: Build static binary
        run: swift build -c release --swift-sdk x86_64-swift-linux-musl
