name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  static-build:
    name: Static Linux build
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install static Linux SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.2-release/static-sdk/swift-6.2-RELEASE/swift-6.2-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz \
            --checksum d2225840e592389ca517bbf71652f7003dbf45ac35d1e57d98b9250368769378
      - name: Build static binary
        run: swift build -c release --swift-sdk x86_64-swift-linux-musl
