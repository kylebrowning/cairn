<!doctype html><html><head><meta charset="utf-8"><title>Kyle Browning — GitHub profile</title>
<link rel="stylesheet" href="styles.css">
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif}a{color:#1a7f37}a:hover{color:#116329}
.bar{display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid #d1d9e0;background:#f6f8fa;font-size:12px;color:#59636e;flex-wrap:wrap}
.bar label{display:flex;gap:6px;align-items:center}
select{font:12px inherit}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.ProfileCardsDesignSystem_840efd;
const { Card, StatRow, StatGrid, Divider, Heatmap, IsoHeatmap } = NS;
const THEMES = [['','Default light'],['default-dark','Default dark'],['paper','Paper'],['paper-dark','Paper dark'],['terminal','Terminal'],['ocean','Ocean'],['ocean-dark','Ocean dark'],['marker','Marker'],['marker-dark','Marker dark']];
const DARK = ['default-dark','paper-dark','terminal','ocean-dark','marker-dark'];
const KEY = 'kb-profile-state';

function ProfileCards({ theme, mobile, iso }) {
  const w = mobile ? 360 : 440;
  const full = mobile ? 360 : 900;
  const activity = (
    <Card key="a" title="Activity" icon="flame" width={w}>
      <StatRow icon="commit" label="Commits" value="13,100" dense />
      <StatRow icon="pr" label="PRs opened" value="915" dense />
      <StatRow icon="merge" label="PRs reviewed" value="39" dense />
      <StatRow icon="issue" label="Issues opened" value="15" dense />
      <StatRow icon="comment" label="Issue comments" value="1,462" dense />
      <StatRow icon="people" label="Contributed to" value="75" dense />
    </Card>
  );
  const repos = (
    <Card key="r" title="Repositories" icon="repo" width={w}>
      <StatRow icon="repo" label="Repositories" value="112" />
      <StatRow icon="package" label="Packages" value="1" />
      <StatRow icon="tag" label="Releases" value="0" />
      <StatRow icon="database" label="Storage used" value="4.36 GB" />
      <Divider label="popularity" />
      <StatGrid items={[{ value: '0', label: 'sponsors' }, { value: '0', label: 'stargazers' }, { value: '0', label: 'forkers' }, { value: '0', label: 'watchers' }]} />
    </Card>
  );
  const community = (
    <Card key="c" title="Community" icon="people" width={w}>
      <StatRow icon="heart" label="Followers" value="203" />
      <StatRow icon="people" label="Following" value="39" />
      <StatRow icon="organization" label="Organizations" value="6" />
      <StatRow icon="star" label="Starred" value="154" />
      <StatRow icon="eye" label="Watching" value="13" />
      <StatRow icon="sparkle" label="Sponsoring" value="0" />
    </Card>
  );
  const commits = (
    <Card key="k" title="Commits" icon="commit" width={w}>
      <StatGrid items={[{ value: '13.1k', label: 'total commits' }, { value: '670', label: 'highest day', accent: true }, { value: '~26.1', label: 'avg / day' }]} />
      <Divider label="streaks" />
      <StatGrid items={[{ value: '23 days', label: 'current streak', accent: true }, { value: '47 days', label: 'best streak' }]} />
    </Card>
  );
  const contribWeeks = mobile ? 23 : 53;
  const contributions = (
    <Card key="h" title="Contributions" icon="calendar" subtitle="last 12 months" width={full} footer="These metrics include private contributions — updated daily by GitHub Actions">
      {iso
        ? <div style={{ display: 'flex', justifyContent: 'center' }}><IsoHeatmap weeks={contribWeeks} pitch={mobile ? 9 : 14} maxBar={mobile ? 26 : 40} /></div>
        : <Heatmap weeks={contribWeeks} weekdayLabels={!mobile} />}
    </Card>
  );
  const col = { display: 'flex', flexDirection: 'column', gap: 20 };
  return (
    <div data-theme={theme || undefined} style={{ display: 'flex', flexDirection: 'column', gap: 20, width: full }}>
      {mobile
        ? <div style={col}>{[activity, commits, repos, community]}</div>
        : <div style={{ display: 'flex', gap: 20 }}>
            <div style={col}>{[activity, repos]}</div>
            <div style={col}>{[community, commits]}</div>
          </div>}
      {contributions}
    </div>
  );
}

function App() {
  const [st, setSt] = React.useState(() => { try { return JSON.parse(localStorage.getItem(KEY)) || { iso: true }; } catch (e) { return { iso: true }; } });
  const set = p => setSt(s => { const n = { ...s, ...p }; localStorage.setItem(KEY, JSON.stringify(n)); return n; });
  const theme = st.theme || '';
  const dark = DARK.includes(theme);
  const chrome = dark ? '#0d1117' : '#ffffff';
  return (
    <div>
      <div className="bar">
        <label>Theme <select value={theme} onChange={e => set({ theme: e.target.value })}>{THEMES.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select></label>
        <label><input type="checkbox" checked={!!st.mobile} onChange={e => set({ mobile: e.target.checked })} /> Mobile 360px</label>
        <label><input type="checkbox" checked={!!st.iso} onChange={e => set({ iso: e.target.checked })} /> Isometric heatmap</label>
        <span style={{ marginLeft: 'auto' }}>GitHub {dark ? 'dark' : 'light'} chrome</span>
      </div>
      <div style={{ background: chrome, minHeight: '100vh', display: 'flex', justifyContent: 'center', padding: '32px 20px' }}>
        <div>
          <div style={{ width: st.mobile ? 360 : 900, color: dark ? '#e6edf3' : '#1f2328', marginBottom: 18 }}>
            <div style={{ fontSize: 20, fontWeight: 600 }}>Kyle Browning</div>
            <div style={{ fontSize: 13, color: dark ? '#9198a1' : '#59636e', marginTop: 2 }}>Joined GitHub 17 years ago · followed by 203 users</div>
          </div>
          <ProfileCards theme={theme} mobile={!!st.mobile} iso={!!st.iso} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
